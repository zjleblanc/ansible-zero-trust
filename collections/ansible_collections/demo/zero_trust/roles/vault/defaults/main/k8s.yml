---
# install_k8s (also referenced by uninstall for detection/cleanup)
vault_k8s_namespace: vault
vault_k8s_release_name: vault
vault_k8s_helm_repo_name: hashicorp
vault_k8s_helm_repo_url: https://helm.releases.hashicorp.com
vault_k8s_helm_chart: hashicorp/vault
vault_k8s_helm_timeout: 5m0s
# Deploy Vault in Helm chart "dev" mode (already initialized and unsealed)
vault_k8s_dev_mode: true
vault_k8s_dev_root_token: root
# Create an OpenShift Route for external access
vault_k8s_route_enabled: true
# Route hostname (required when vault_k8s_route_enabled is true)
# vault_k8s_route_host: vault.apps.example.com
# External Vault URL for health checks and vault_cli_addr; defaults to https://vault_k8s_route_host
# vault_k8s_url: https://vault.apps.example.com
vault_k8s_pod_name: vault-0
# CLI used for remote vault_cli invocations (oc or kubectl)
vault_k8s_cli: oc
# Optional kubeconfig path for kubernetes.core modules
# vault_k8s_kubeconfig: ~/.kube/config
vault_k8s_wait_retries: 30
vault_k8s_wait_delay: 10
vault_k8s_health_retries: 12
vault_k8s_health_delay: 5
