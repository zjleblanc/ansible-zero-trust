---
# install_podman (also referenced by uninstall for detection/cleanup)
vault_container_name: vault
vault_container_image: registry.connect.redhat.com/hashicorp/vault:latest
vault_container_uid: "100"
vault_container_gid: "100"
vault_container_storage_path: /vault/data
vault_container_config_path: /vault/config
vault_container_tls_dir: /vault/tls
# Podman network to join (e.g. shared with demo.zero_trust.cloudflare); empty disables custom networking
vault_podman_network: ""
# Rootless Podman toggle: true (default) uses a user-scoped Quadlet under vault_podman_user;
# false uses system-wide rootful Quadlet
vault_podman_rootless: true
vault_podman_user: "{{ ansible_user | default(ansible_facts['user_id']) }}"
