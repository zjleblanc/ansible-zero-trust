---
argument_specs:
  configure_host:
    short_description: Copy TLS certs and configure firewall for Vault
    options:
      vault_port:
        type: str
        required: true
        description: TCP port Vault listens on (also opened in firewalld)
      vault_fqdn:
        type: str
        required: false
        description: Fully qualified domain name for Vault
      vault_tls_enabled:
        type: bool
        required: true
        description: Whether TLS is enabled for Vault
      vault_tls_cert_dest:
        type: path
        required: false
        default: "/opt/vault/tls/fullchain_{{ vault_fqdn }}.pem"
        description: Destination path for the TLS certificate on the host
      vault_tls_key_dest:
        type: path
        required: false
        default: "/opt/vault/tls/{{ vault_fqdn }}.key"
        description: Destination path for the TLS private key on the host
      vault_tls_cert_src:
        type: path
        required: false
        description: Controller-side path to the TLS certificate to copy
      vault_tls_key_src:
        type: path
        required: false
        description: Controller-side path to the TLS private key to copy

  install_rpm:
    short_description: Install Vault via HashiCorp RPM repository
    options:
      vault_fqdn:
        type: str
        required: false
        description: Fully qualified domain name for Vault
      vault_port:
        type: str
        required: true
        description: TCP port Vault listens on
      vault_storage_path:
        type: path
        required: true
        description: Host path for Vault file storage
      vault_tls_enabled:
        type: bool
        required: true
        description: Whether TLS is enabled for Vault
      vault_tls_cert_dest:
        type: path
        required: false
        default: "/opt/vault/tls/fullchain_{{ vault_fqdn }}.pem"
        description: Destination path for the TLS certificate on the host
      vault_tls_key_dest:
        type: path
        required: false
        default: "/opt/vault/tls/{{ vault_fqdn }}.key"
        description: Destination path for the TLS private key on the host

  install_podman:
    short_description: Install Vault via Podman Quadlet
    options:
      vault_port:
        type: str
        required: true
        description: TCP port Vault listens on
      vault_storage_path:
        type: path
        required: true
        description: Host path for Vault file storage
      vault_config_path:
        type: path
        required: true
        description: Host path for Vault configuration
      vault_tls_enabled:
        type: bool
        required: true
        description: Whether TLS is enabled for Vault
      vault_tls_cert_dest:
        type: path
        required: false
        default: "/opt/vault/tls/fullchain_{{ vault_fqdn }}.pem"
        description: Destination path for the TLS certificate on the host
      vault_tls_key_dest:
        type: path
        required: false
        default: "/opt/vault/tls/{{ vault_fqdn }}.key"
        description: Destination path for the TLS private key on the host
      vault_container_image:
        type: str
        required: true
        description: Container image reference for Vault
      vault_container_name:
        type: str
        required: true
        description: Podman container / Quadlet unit name
      vault_container_uid:
        type: str
        required: true
        description: UID owning Vault data inside the container
      vault_container_gid:
        type: str
        required: true
        description: GID owning Vault data inside the container
      vault_container_storage_path:
        type: path
        required: true
        description: In-container path for Vault file storage
      vault_container_config_path:
        type: path
        required: true
        description: In-container path for Vault configuration
      vault_container_tls_dir:
        type: path
        required: false
        description: In-container directory for TLS material
      vault_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output
      vault_registry:
        type: str
        required: false
        description: Container registry hostname for authenticated pulls
      vault_registry_username:
        type: str
        required: false
        description: Username for container registry authentication
      vault_registry_password:
        type: str
        required: false
        description: Password for container registry authentication
      vault_podman_network:
        type: str
        required: false
        default: ""
        description: >-
          Podman network to join (e.g. shared with demo.zero_trust.cloudflare so
          cloudflared can reach Vault by container name); empty disables custom networking
      vault_podman_rootless:
        type: bool
        required: false
        default: true
        description: >-
          Run Vault as a rootless Podman Quadlet under vault_podman_user (default).
          Set false for a system-wide rootful Quadlet.
      vault_podman_user:
        type: str
        required: false
        description: >-
          User account that owns the rootless Podman Quadlet when vault_podman_rootless
          is true (defaults to ansible_user)

  install_k8s:
    short_description: Install Vault on Kubernetes/OpenShift via Helm
    options:
      vault_port:
        type: str
        required: true
        description: TCP port Vault listens on inside the pod
      vault_storage_path:
        type: path
        required: true
        description: >-
          Host path where init_data.json is written (synthetic root token in
          Helm chart dev mode; operator init output otherwise)
      vault_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output
      vault_k8s_namespace:
        type: str
        required: false
        default: vault
        description: Kubernetes namespace for the Vault release
      vault_k8s_release_name:
        type: str
        required: false
        default: vault
        description: Helm release name
      vault_k8s_helm_repo_name:
        type: str
        required: false
        default: hashicorp
        description: Name of the Helm repository to add
      vault_k8s_helm_repo_url:
        type: str
        required: false
        default: https://helm.releases.hashicorp.com
        description: URL of the Helm repository to add
      vault_k8s_helm_chart:
        type: str
        required: false
        default: hashicorp/vault
        description: Helm chart reference for Vault
      vault_k8s_helm_timeout:
        type: str
        required: false
        default: 5m0s
        description: Helm wait timeout (e.g. 5m0s)
      vault_k8s_image_repository:
        type: str
        required: false
        default: docker.io/hashicorp/vault
        description: >-
          Vault server image repository. Fully qualified (docker.io/...) so
          OpenShift short-name search does not pull from
          registry.connect.redhat.com.
      vault_k8s_image_tag:
        type: str
        required: false
        description: >-
          Vault server image tag. When unset, the Helm chart default tag is used.
      vault_k8s_dev_mode:
        type: bool
        required: false
        default: true
        description: >-
          Deploy Vault in Helm chart "dev" mode (already initialized and
          unsealed). Skip init_vault when true.
      vault_k8s_dev_root_token:
        type: str
        required: false
        default: root
        description: Root token used when vault_k8s_dev_mode is true
      vault_k8s_route_enabled:
        type: bool
        required: false
        default: true
        description: Create an OpenShift Route for external access
      vault_k8s_cluster_base_url:
        type: str
        required: false
        description: >-
          Cluster base domain without scheme or apps. prefix (e.g.
          cluster.example.com). When unset on OpenShift, discovered from
          config.openshift.io/v1 Ingress/cluster by stripping a leading apps..
          Used to derive vault_k8s_route_host as
          <vault_k8s_release_name>.apps.<base>, vault_k8s_url (https://...),
          vault_fqdn, and vault_addr.
      vault_k8s_route_host:
        type: str
        required: false
        description: >-
          OpenShift Route hostname. When unset and vault_k8s_route_enabled is
          true, defaults to <vault_k8s_release_name>.apps.<vault_k8s_cluster_base_url>.
          Set explicitly to override.
      vault_k8s_url:
        type: str
        required: false
        description: >-
          External Vault URL for health checks, vault_cli_addr, and vault_addr
          (JWT audiences). Defaults to https://<vault_k8s_route_host> when
          unset. Also used to derive vault_fqdn when vault_fqdn is unset.
      vault_k8s_pod_name:
        type: str
        required: false
        default: vault-0
        description: Vault server pod name used for kubectl/oc exec vault_cli
      vault_k8s_cli:
        type: str
        required: false
        default: oc
        description: CLI binary for remote vault_cli invocations (oc or kubectl)
      vault_k8s_kubeconfig:
        type: path
        required: false
        description: Optional kubeconfig path for kubernetes.core modules
      vault_k8s_wait_retries:
        type: int
        required: false
        default: 30
        description: Retries while waiting for the Vault pod to become ready
      vault_k8s_wait_delay:
        type: int
        required: false
        default: 10
        description: Delay in seconds between pod readiness polls
      vault_k8s_health_retries:
        type: int
        required: false
        default: 12
        description: Retries while verifying Vault HTTP health
      vault_k8s_health_delay:
        type: int
        required: false
        default: 5
        description: Delay in seconds between Vault health checks

  init_vault:
    short_description: Initialize, unseal, and report Vault status
    options:
      vault_cli:
        type: str
        required: true
        description: Vault CLI invocation (binary, podman exec, or kubectl/oc exec wrapper)
      vault_cli_addr:
        type: str
        required: true
        description: VAULT_ADDR value for CLI operations
      vault_storage_path:
        type: path
        required: true
        description: Host path where init_data.json is written
      vault_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output

  configure_jwt_auth:
    short_description: Enable and configure Vault JWT auth for AAP OIDC workload identity
    options:
      vault_fqdn:
        type: str
        required: false
        description: >-
          Fully qualified domain name for Vault. For k8s, derived from
          vault_k8s_cluster_base_url / Route / vault_k8s_url when unset.
      vault_cli:
        type: str
        required: true
        description: Vault CLI invocation (binary, podman exec, or kubectl/oc exec wrapper)
      vault_cli_addr:
        type: str
        required: true
        description: VAULT_ADDR value for CLI operations
      vault_token:
        type: str
        required: false
        description: >-
          Vault root or admin token. Optional when set by init_vault or
          install_k8s (dev mode) in the same play, or when init_data.json under
          vault_storage_path contains root_token.
      vault_storage_path:
        type: path
        required: true
        description: Host path where JWT config artifacts are written
      vault_container_storage_path:
        type: path
        required: false
        description: In-container storage path used for CLI @file arguments when vault_cli uses podman
      vault_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output
      vault_jwt_oidc_discovery_url:
        type: str
        required: true
        description: AAP OIDC discovery URL (AAP base URL with /o suffix)
      vault_jwt_oidc_discovery_ca_pem:
        type: path
        required: false
        description: Controller-side path to CA PEM for AAP TLS discovery (optional)
      vault_jwt_bound_audiences:
        type: list
        elements: str
        required: false
        description: Audiences accepted by JWT roles (defaults to vault_addr)
      vault_jwt_static_role_name:
        type: str
        required: false
        default: aap-role-static
        description: Name of the static JWT role
      vault_jwt_static_policy_name:
        type: str
        required: false
        default: aap-policy-static
        description: Name of the static Vault policy
      vault_jwt_static_secret_path:
        type: str
        required: false
        default: secret/data/aap/*
        description: KV path granted read by the static policy
      vault_jwt_static_bound_claims:
        type: dict
        required: false
        description: bound_claims mapping for the static JWT role
      vault_jwt_dynamic_role_name:
        type: str
        required: false
        default: aap-role-dynamic
        description: Name of the dynamic JWT role
      vault_jwt_dynamic_policy_name:
        type: str
        required: false
        default: aap-policy-dynamic
        description: Name of the templated Vault policy
      vault_jwt_dynamic_bound_claims:
        type: dict
        required: false
        description: bound_claims mapping for the dynamic JWT role
      vault_jwt_dynamic_claim_mappings:
        type: dict
        required: false
        description: JWT claim to metadata mappings for templated policies
      vault_jwt_dynamic_secret_path_template:
        type: str
        required: false
        description: >-
          Templated KV path for the dynamic policy. Use JWT_ACCESSOR as a
          placeholder for the jwt/ auth method accessor, and [[ ]] as stand-ins
          for Vault identity template braces (so Ansible does not interpolate them).

  configure_userpass_auth:
    short_description: Enable userpass auth and create users from a JSON config file
    options:
      vault_cli:
        type: str
        required: true
        description: Vault CLI invocation (binary or podman exec wrapper)
      vault_cli_addr:
        type: str
        required: true
        description: VAULT_ADDR value for CLI operations
      vault_token:
        type: str
        required: false
        description: >-
          Vault root or admin token. Optional when set by init_vault in the same
          play or when init_data.json under vault_storage_path contains root_token.
      vault_storage_path:
        type: path
        required: true
        description: Host path where generated userpass credentials are written
      vault_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output
      vault_userpass_users_file:
        type: str
        required: false
        default: vault_users.json
        description: >-
          Filename under the role files/ directory containing the users list
          (username, role admin|user, optional password)
      vault_userpass_credentials_file:
        type: str
        required: false
        default: userpass_credentials.json
        description: Filename under vault_storage_path for auto-generated passwords
      vault_userpass_admin_policy_name:
        type: str
        required: false
        default: admin-policy
        description: Policy name attached to role=admin users (full access)
      vault_userpass_user_policy_name:
        type: str
        required: false
        default: user-policy
        description: Policy name attached to role=user users (read policies and secrets)
      vault_userpass_user_secret_path:
        type: str
        required: false
        default: secret/data/*
        description: KV data path granted read/list by the user policy
      vault_userpass_user_secret_metadata_path:
        type: str
        required: false
        default: secret/metadata/*
        description: KV metadata path granted read/list by the user policy
      vault_userpass_password_length:
        type: int
        required: false
        default: 24
        description: Length of auto-generated userpass passwords
      vault_userpass_password_chars:
        type: str
        required: false
        default: ascii_letters,digits
        description: Character classes for auto-generated passwords (password lookup)

  configure_kv_engine:
    short_description: Enable KV v2 secrets engine and seed sample secrets for e2e testing
    options:
      vault_cli:
        type: str
        required: true
        description: Vault CLI invocation (binary or podman exec wrapper)
      vault_cli_addr:
        type: str
        required: true
        description: VAULT_ADDR value for CLI operations
      vault_token:
        type: str
        required: false
        description: >-
          Vault root or admin token. Optional when set by init_vault in the same
          play or when init_data.json under vault_storage_path contains root_token.
      vault_storage_path:
        type: path
        required: true
        description: Host path where init_data.json is stored for token lookup
      vault_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output
      vault_kv_engine_path:
        type: str
        required: false
        default: secret
        description: Mount path for the KV secrets engine
      vault_kv_engine_version:
        type: str
        required: false
        default: "2"
        description: KV secrets engine version (1 or 2)
      vault_kv_sample_secrets:
        type: list
        elements: dict
        required: false
        description: >-
          List of sample secrets to seed. Each entry has a path (KV v2 data path)
          and a data dict of key-value pairs. Default entries align with the static
          and dynamic JWT policy paths for e2e testing.

  uninstall:
    short_description: Remove Vault artifacts and config for a given deployment type
    options:
      vault_deployment_type:
        type: str
        required: true
        choices:
          - rpm
          - podman
          - k8s
        description: >-
          Deployment type to uninstall. Must match how Vault was installed
          (install_rpm, install_podman, or install_k8s).
      vault_port:
        type: str
        required: true
        description: TCP port Vault listens on (closed in firewalld)
      vault_tls_enabled:
        type: bool
        required: true
        description: Whether TLS was enabled for Vault
      vault_tls_cert_dest:
        type: path
        required: false
        description: Destination path of the TLS certificate to remove
      vault_tls_key_dest:
        type: path
        required: false
        description: Destination path of the TLS private key to remove
      vault_storage_path:
        type: path
        required: true
        description: Host path for Vault file storage to remove
      vault_config_path:
        type: path
        required: true
        description: Host path for Vault configuration to remove
      vault_container_name:
        type: str
        required: true
        description: Podman container / Quadlet unit name (used for detection and cleanup)
      vault_container_image:
        type: str
        required: true
        description: Container image reference to remove when Podman install is detected
      vault_podman_network:
        type: str
        required: false
        default: ""
        description: Podman network to remove during cleanup; empty skips network removal
      vault_podman_rootless:
        type: bool
        required: false
        default: true
        description: Whether Vault was deployed as a rootless Podman Quadlet (must match install-time value)
      vault_podman_user:
        type: str
        required: false
        description: >-
          User account that owns the rootless Podman Quadlet when vault_podman_rootless
          is true (defaults to ansible_user)
      vault_k8s_namespace:
        type: str
        required: false
        default: vault
        description: Kubernetes namespace used for Helm release detection and cleanup
      vault_k8s_release_name:
        type: str
        required: false
        default: vault
        description: Helm release name used for detection and cleanup
      vault_k8s_route_enabled:
        type: bool
        required: false
        default: true
        description: Whether an OpenShift Route was created and should be removed
      vault_k8s_helm_timeout:
        type: str
        required: false
        default: 5m0s
        description: Helm wait timeout when uninstalling the release
      vault_k8s_kubeconfig:
        type: path
        required: false
        description: Optional kubeconfig path for kubernetes.core modules
