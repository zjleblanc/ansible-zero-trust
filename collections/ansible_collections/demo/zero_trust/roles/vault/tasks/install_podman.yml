---
- name: Install podman
  become: true
  ansible.builtin.dnf:
    name: podman
    state: present

- name: Ensure rootless Podman user exists
  when: vault_podman_rootless | bool
  become: true
  ansible.builtin.user:
    name: "{{ vault_podman_user }}"
    state: present

- name: Look up rootless Podman user account details
  when: vault_podman_rootless | bool
  ansible.builtin.getent:
    database: passwd
    key: "{{ vault_podman_user }}"

- name: Check if lingering is enabled for rootless Podman user
  when: vault_podman_rootless | bool
  become: true
  register: vault_podman_linger_check
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ vault_podman_user }}"

- name: Enable lingering for rootless Podman user
  # No dedicated module wraps `loginctl enable-linger`; the stat check above keeps this
  # idempotent (only runs, and reports changed, the first time). Linger keeps the user's
  # systemd instance (and its rootless containers) running without an active login session.
  when:
    - vault_podman_rootless | bool
    - not (vault_podman_linger_check.stat.exists | default(false))
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ vault_podman_user }}"

- name: Set Podman privilege and path facts
  vars:
    _rootless: "{{ vault_podman_rootless | bool }}"
  ansible.builtin.set_fact:
    # Always become, then drop to vault_podman_user when rootless (become_user is
    # ignored when become is false). Use | bool — Jinja "{{ false }}" can stringify.
    _vault_podman_become: true
    _vault_podman_become_user: "{{ vault_podman_user if (_rootless | bool) else '' }}"
    _vault_podman_systemd_scope: "{{ 'user' if (_rootless | bool) else 'system' }}"
    _vault_podman_quadlet_dir: >-
      {{ (ansible_facts.getent_passwd[vault_podman_user][4] + '/.config/containers/systemd')
         if (_rootless | bool) else '/etc/containers/systemd' }}
    _vault_podman_environment: >-
      {{ {'XDG_RUNTIME_DIR': '/run/user/' + ansible_facts.getent_passwd[vault_podman_user][1]}
         if (_rootless | bool) else {} }}

- name: Create Podman network
  when: vault_podman_network | length > 0
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  environment: "{{ _vault_podman_environment }}"
  containers.podman.podman_network:
    name: "{{ vault_podman_network }}"
    state: present

- name: Validate registry credentials are complete
  when: >-
    (vault_registry_username is defined) or
    (vault_registry_password is defined)
  ansible.builtin.assert:
    fail_msg: >-
      Provide both vault_registry_username and vault_registry_password
      (and optionally vault_registry) to authenticate image pulls.
    that:
      - vault_registry_username is defined
      - vault_registry_username | length > 0
      - vault_registry_password is defined
      - vault_registry_password | length > 0

- name: Log in to container registry
  when:
    - vault_registry_username is defined
    - vault_registry_username | length > 0
    - vault_registry_password is defined
    - vault_registry_password | length > 0
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  no_log: "{{ vault_no_log | default(true) }}"
  environment: "{{ _vault_podman_environment }}"
  vars:
    _vault_registry: >-
      {{ vault_registry | default(
           vault_container_image.split('/')[0]
           if (vault_container_image is match('^[^/]+\.[^/]+/'))
           else 'docker.io',
           true
         ) }}
  containers.podman.podman_login:
    password: "{{ vault_registry_password }}"
    registry: "{{ _vault_registry }}"
    username: "{{ vault_registry_username }}"

- name: Pull Vault container image
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  environment: "{{ _vault_podman_environment }}"
  containers.podman.podman_image:
    name: "{{ vault_container_image }}"
    state: present

- name: Create vault host directories
  loop:
    - "{{ vault_storage_path }}"
    - "{{ vault_config_path }}"
    - "{{ vault_tls_cert_dest | dirname }}"
  loop_control:
    label: "{{ item }}"
  become: true
  ansible.builtin.file:
    state: directory
    group: "{{ vault_podman_user if (vault_podman_rootless | bool) else vault_container_gid }}"
    mode: "0755"
    owner: "{{ vault_podman_user if (vault_podman_rootless | bool) else vault_container_uid }}"
    path: "{{ item }}"

- name: Stat TLS files
  when: vault_tls_enabled | bool
  loop:
    - "{{ vault_tls_cert_dest }}"
    - "{{ vault_tls_key_dest }}"
  loop_control:
    label: "{{ item }}"
  become: true
  register: vault_podman_tls_files
  ansible.builtin.stat:
    path: "{{ item }}"

- name: Set TLS file ownership for container
  when: item.stat.exists | default(false)
  loop: "{{ vault_podman_tls_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default(item) }}"
  become: true
  ansible.builtin.file:
    group: "{{ vault_podman_user if (vault_podman_rootless | bool) else vault_container_gid }}"
    owner: "{{ vault_podman_user if (vault_podman_rootless | bool) else vault_container_uid }}"
    path: "{{ item.item }}"

- name: Template vault config for container
  become: true
  vars:
    vault_config_storage_path: "{{ vault_container_storage_path }}"
    vault_config_tls_cert: "{{ vault_container_tls_dir }}/{{ vault_tls_cert_dest | basename }}"
    vault_config_tls_key: "{{ vault_container_tls_dir }}/{{ vault_tls_key_dest | basename }}"
  ansible.builtin.template:
    dest: "{{ vault_config_path }}/vault.hcl"
    group: "{{ vault_podman_user if (vault_podman_rootless | bool) else vault_container_gid }}"
    mode: "0640"
    owner: "{{ vault_podman_user if (vault_podman_rootless | bool) else vault_container_uid }}"
    src: vault.hcl.j2

- name: Ensure Quadlet unit directory exists
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  ansible.builtin.file:
    state: directory
    mode: "0755"
    path: "{{ _vault_podman_quadlet_dir }}"

- name: Remove legacy podman generate-systemd unit if present
  when: not (vault_podman_rootless | bool)
  become: true
  ansible.builtin.file:
    state: absent
    path: "/etc/systemd/system/container-{{ vault_container_name }}.service"

- name: Install Vault Quadlet unit
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  register: vault_quadlet
  ansible.builtin.template:
    dest: "{{ _vault_podman_quadlet_dir }}/{{ vault_container_name }}.container"
    mode: "0644"
    src: vault.container.j2

- name: Reload systemd to pick up Quadlet unit
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  environment: "{{ _vault_podman_environment }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: "{{ _vault_podman_systemd_scope }}"

- name: Enable and start Vault Quadlet service on boot
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  environment: "{{ _vault_podman_environment }}"
  ansible.builtin.systemd:
    name: "{{ vault_container_name }}.service"
    scope: "{{ _vault_podman_systemd_scope }}"
    state: "{{ 'restarted' if vault_quadlet.changed else 'started' }}"
    enabled: true

- name: Check Vault container is running
  become: "{{ _vault_podman_become }}"
  become_user: "{{ _vault_podman_become_user if (_vault_podman_become_user | length > 0) else omit }}"
  register: vault_container_running
  until: >-
    (vault_container_running.containers | default([])
     | selectattr('State', 'defined')
     | selectattr('State.Running', 'defined')
     | selectattr('State.Running')
     | list | length) > 0
  retries: 3
  delay: 2
  failed_when: false
  environment: "{{ _vault_podman_environment }}"
  containers.podman.podman_container_info:
    name: "{{ vault_container_name }}"

- name: Fail when Vault container is not running
  when: >-
    (vault_container_running.containers | default([])
     | selectattr('State', 'defined')
     | selectattr('State.Running', 'defined')
     | selectattr('State.Running')
     | list | length) == 0
  ansible.builtin.fail:
    msg: >-
      Vault container "{{ vault_container_name }}" is not running after starting
      {{ vault_container_name }}.service (scope={{ _vault_podman_systemd_scope }}).
      Inspect with: systemctl {{ '--user ' if (vault_podman_rootless | bool) else '' }}status {{ vault_container_name }}.service
      and: podman logs {{ vault_container_name }}

- name: Set vault CLI facts for podman deployment
  ansible.builtin.set_fact:
    # -e VAULT_TOKEN (no value) forwards the host process env into the container so
    # Ansible environment: VAULT_TOKEN=... reaches vault CLI inside podman exec.
    vault_cli: >-
      podman exec
      -e VAULT_ADDR={{ vault_tls_enabled | ternary('https', 'http') }}://127.0.0.1:{{ vault_port }}
      -e VAULT_SKIP_VERIFY=1
      -e VAULT_TOKEN
      {{ vault_container_name }} vault
    vault_cli_addr: "{{ vault_tls_enabled | ternary('https', 'http') }}://127.0.0.1:{{ vault_port }}"
