---
# Deploy Vault on Kubernetes/OpenShift via Helm.
# Based on https://github.com/l3acon/aap-vault (deploy-vault.yml).

- name: Resolve Kubernetes auth options
  ansible.builtin.set_fact:
    _k8s_auth: >-
      {{ {'kubeconfig': vault_k8s_kubeconfig}
         if (vault_k8s_kubeconfig is defined and vault_k8s_kubeconfig | length > 0)
         else {} }}

- name: Discover OpenShift ingress domain for cluster base URL
  when:
    - vault_k8s_cluster_base_url is not defined or vault_k8s_cluster_base_url | length == 0
    - >-
      (vault_k8s_route_host is not defined or vault_k8s_route_host | length == 0)
      or (vault_k8s_url is not defined or vault_k8s_url | length == 0)
  register: _vault_k8s_ingress
  failed_when: false
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"

- name: Set cluster base URL from OpenShift ingress domain
  when:
    - vault_k8s_cluster_base_url is not defined or vault_k8s_cluster_base_url | length == 0
    - _vault_k8s_ingress is defined
    - not (_vault_k8s_ingress is failed)
    - (_vault_k8s_ingress.resources | default([]) | length > 0)
    - (_vault_k8s_ingress.resources[0].spec.domain | default('') | length > 0)
  vars:
    # Ingress domain is typically apps.<cluster>; store the cluster base only.
    _vault_k8s_ingress_domain: "{{ _vault_k8s_ingress.resources[0].spec.domain }}"
  ansible.builtin.set_fact:
    vault_k8s_cluster_base_url: >-
      {{ _vault_k8s_ingress_domain | regex_replace('^apps\\.', '') }}

- name: Normalize cluster base URL
  when: vault_k8s_cluster_base_url is defined and vault_k8s_cluster_base_url | length > 0
  vars:
    # Accept accidental scheme/host forms; keep a bare domain (cluster.example.com).
    _vault_k8s_base_raw: >-
      {{ vault_k8s_cluster_base_url | urlsplit('hostname')
         if ('://' in vault_k8s_cluster_base_url)
         else (vault_k8s_cluster_base_url | regex_replace('^https?://', '') | regex_replace('/+$', '')) }}
  ansible.builtin.set_fact:
    vault_k8s_cluster_base_url: >-
      {{ _vault_k8s_base_raw | regex_replace('^apps\\.', '') }}

- name: Require cluster base URL, Route host, or Vault URL
  ansible.builtin.assert:
    fail_msg: >-
      Set vault_k8s_cluster_base_url (e.g. cluster.example.com), or provide
      vault_k8s_route_host / vault_k8s_url explicitly. On OpenShift the cluster
      base is discovered from config.openshift.io/v1 Ingress/cluster when unset.
      When not using a Route, set vault_k8s_route_enabled to false and provide
      vault_k8s_cluster_base_url or vault_k8s_url.
    that:
      - >-
        (vault_k8s_cluster_base_url is defined and vault_k8s_cluster_base_url | length > 0)
        or (vault_k8s_route_host is defined and vault_k8s_route_host | length > 0)
        or (vault_k8s_url is defined and vault_k8s_url | length > 0)

- name: Set Route host from cluster base URL
  when:
    - vault_k8s_route_enabled | bool
    - vault_k8s_route_host is not defined or vault_k8s_route_host | length == 0
    - vault_k8s_cluster_base_url is defined
    - vault_k8s_cluster_base_url | length > 0
  ansible.builtin.set_fact:
    vault_k8s_route_host: >-
      {{ vault_k8s_release_name }}.apps.{{ vault_k8s_cluster_base_url }}

- name: Set Route host from Vault URL hostname
  when:
    - vault_k8s_route_enabled | bool
    - vault_k8s_route_host is not defined or vault_k8s_route_host | length == 0
    - vault_k8s_url is defined
    - vault_k8s_url | length > 0
  ansible.builtin.set_fact:
    vault_k8s_route_host: "{{ vault_k8s_url | urlsplit('hostname') }}"

- name: Require Route host when OpenShift Route is enabled
  when: vault_k8s_route_enabled | bool
  ansible.builtin.assert:
    fail_msg: >-
      vault_k8s_route_host could not be derived. Set vault_k8s_cluster_base_url
      (or vault_k8s_route_host / vault_k8s_url), or ensure OpenShift ingress
      domain discovery succeeds.
    that:
      - vault_k8s_route_host is defined
      - vault_k8s_route_host | length > 0

- name: Set Kubernetes Vault URL and address facts
  vars:
    _vault_k8s_has_base: >-
      {{ vault_k8s_cluster_base_url is defined and vault_k8s_cluster_base_url | length > 0 }}
    _vault_k8s_has_route_host: >-
      {{ vault_k8s_route_host is defined and vault_k8s_route_host | length > 0 }}
    _vault_k8s_has_url: >-
      {{ vault_k8s_url is defined and vault_k8s_url | length > 0 }}
    _vault_k8s_derived_host: >-
      {{ vault_k8s_route_host if (_vault_k8s_has_route_host | bool)
         else (
           (vault_k8s_release_name ~ '.apps.' ~ vault_k8s_cluster_base_url)
           if (_vault_k8s_has_base | bool) else ''
         ) }}
    _vault_k8s_url_resolved: >-
      {{ vault_k8s_url if (_vault_k8s_has_url | bool)
         else (
           ('https://' ~ _vault_k8s_derived_host)
           if (_vault_k8s_derived_host | length > 0)
           else ('https://' ~ vault_k8s_route_host)
         ) }}
    _vault_k8s_hostname: "{{ _vault_k8s_url_resolved | urlsplit('hostname') }}"
  ansible.builtin.set_fact:
    _vault_k8s_url: "{{ _vault_k8s_url_resolved }}"
    # Prefer an explicit vault_fqdn; otherwise use the Route / URL hostname.
    vault_fqdn: "{{ vault_fqdn | default(_vault_k8s_hostname, true) }}"
    # External URL (typically https on 443 via Route/Ingress), not host:8200.
    vault_addr: "{{ _vault_k8s_url_resolved }}"

- name: Create Vault namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ vault_k8s_namespace }}"
    state: present
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"

- name: Add HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: "{{ vault_k8s_helm_repo_name }}"
    repo_url: "{{ vault_k8s_helm_repo_url }}"
    state: present
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"

- name: Deploy Vault via Helm
  kubernetes.core.helm:
    name: "{{ vault_k8s_release_name }}"
    chart_ref: "{{ vault_k8s_helm_chart }}"
    release_namespace: "{{ vault_k8s_namespace }}"
    create_namespace: true
    values: "{{ lookup('ansible.builtin.template', 'vault-helm-values.yml.j2') | from_yaml }}"
    wait: true
    wait_timeout: "{{ vault_k8s_helm_timeout }}"
    state: present
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"

- name: Create Vault Route for external access
  when: vault_k8s_route_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'vault-route.yml.j2') | from_yaml }}"
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"

- name: Wait for Vault pod to be ready
  register: vault_pods
  until: >-
    vault_pods.resources | length > 0 and
    vault_pods.resources[0].status.containerStatuses | default([])
    | selectattr('ready', 'equalto', true) | list | length > 0
  retries: "{{ vault_k8s_wait_retries | int }}"
  delay: "{{ vault_k8s_wait_delay | int }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ vault_k8s_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=vault
      - component=server
    field_selectors:
      - status.phase=Running
    kubeconfig: "{{ _k8s_auth.kubeconfig | default(omit) }}"

- name: Verify Vault is accessible
  register: vault_health
  until: vault_health is not failed
  retries: "{{ vault_k8s_health_retries | int }}"
  delay: "{{ vault_k8s_health_delay | int }}"
  ansible.builtin.uri:
    url: "{{ _vault_k8s_url }}/v1/sys/health"
    method: GET
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 501
      - 503
    validate_certs: true

- name: Display Vault status
  ansible.builtin.debug:
    msg: >-
      Vault is running at {{ _vault_k8s_url }}
      (initialized={{ vault_health.json.initialized | default('unknown') }},
      sealed={{ vault_health.json.sealed | default('unknown') }})

- name: Ensure host storage path exists for init artifacts
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0755"
    path: "{{ vault_storage_path }}"

- name: Persist synthetic init data for Helm chart dev mode
  when: vault_k8s_dev_mode | bool
  become: true
  no_log: "{{ vault_no_log | default(true) }}"
  ansible.builtin.copy:
    content: "{{ {'root_token': vault_k8s_dev_root_token} | to_nice_json(indent=2) }}\n"
    dest: "{{ vault_storage_path }}/init_data.json"
    mode: "0600"

- name: Set vault_token from Helm chart root token
  when: vault_k8s_dev_mode | bool
  no_log: "{{ vault_no_log | default(true) }}"
  ansible.builtin.set_fact:
    vault_token: "{{ vault_k8s_dev_root_token }}"

- name: Set vault CLI facts for Kubernetes deployment
  ansible.builtin.set_fact:
    # Base invocation without VAULT_TOKEN. set_vault_cli_context.yml injects
    # --env=VAULT_TOKEN=... when vault_token is available so Ansible-configured
    # tokens reach the vault CLI inside the pod (kubectl has no -e pass-through).
    # In-pod listener is plain HTTP (TLS terminates at the Route/Ingress).
    # Trailing -- separates kubectl args from the remote vault command.
    vault_cli_base: >-
      {{ vault_k8s_cli }} exec
      -n {{ vault_k8s_namespace }}
      {{ vault_k8s_pod_name }}
      --env=VAULT_ADDR=http://127.0.0.1:{{ vault_port }}
      --env=VAULT_SKIP_VERIFY=1
      -- vault
    vault_cli: >-
      {{ vault_k8s_cli }} exec
      -n {{ vault_k8s_namespace }}
      {{ vault_k8s_pod_name }}
      --env=VAULT_ADDR=http://127.0.0.1:{{ vault_port }}
      --env=VAULT_SKIP_VERIFY=1
      -- vault
    vault_cli_addr: "{{ _vault_k8s_url }}"
