---
# Privilege context for vault_cli invocations.
# Kubernetes (kubectl/oc exec): no privilege escalation; inject VAULT_TOKEN via --env.
# Rootless Podman: become the Podman user so `podman exec` sees that user's containers.
# Rootful Podman / RPM: become root.

- name: Set vault CLI privilege context for Kubernetes
  when: vault_cli is match('^(kubectl|oc)\\s+exec\\b')
  vars:
    _k8s_token_env: >-
      {{ ('--env=VAULT_TOKEN=' ~ vault_token ~ ' ')
         if (vault_token is defined and (vault_token | length) > 0)
         else '' }}
    _k8s_cli_base: "{{ vault_cli_base | default(vault_cli) }}"
  ansible.builtin.set_fact:
    _vault_cli_become: false
    _vault_cli_become_user: ""
    _vault_cli_environment: {}
    # Rebuild from vault_cli_base so repeated includes do not stack --env=VAULT_TOKEN.
    vault_cli: >-
      {{ _k8s_cli_base | regex_replace(' -- ', ' ' ~ _k8s_token_env ~ '-- ') }}

- name: Look up rootless Podman user for vault CLI
  when:
    - vault_cli is match('^podman\\s+exec\\b')
    - vault_podman_rootless | bool
  ansible.builtin.getent:
    database: passwd
    key: "{{ vault_podman_user }}"

- name: Set vault CLI privilege context for Podman or RPM
  when: not (vault_cli is match('^(kubectl|oc)\\s+exec\\b'))
  vars:
    _rootless_cli: "{{ (vault_cli is match('^podman\\s+exec\\b')) and (vault_podman_rootless | bool) }}"
  ansible.builtin.set_fact:
    _vault_cli_become: true
    _vault_cli_become_user: "{{ vault_podman_user if (_rootless_cli | bool) else '' }}"
    _vault_cli_environment: >-
      {{ {'XDG_RUNTIME_DIR': '/run/user/' + ansible_facts.getent_passwd[vault_podman_user][1]}
         if (_rootless_cli | bool) else {} }}
