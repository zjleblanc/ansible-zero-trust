---
# install / uninstall
#
# cloudflared_tunnel_token bridges from the fact set by demo.zero_trust.cloudflare_tunnel's
# create entry point when run in the same play; override explicitly otherwise.
cloudflared_tunnel_token: "{{ cloudflare_tunnel_token | default('') }}"
cloudflared_container_image: docker.io/cloudflare/cloudflared:latest
cloudflared_container_name: cloudflared
cloudflared_podman_secret_name: cloudflare_tunnel_token
cloudflared_uninstall_remove_image: true
# Podman network to join (e.g. shared with demo.zero_trust.vault); empty disables custom networking
cloudflared_podman_network: ""
# Rootless Podman toggle: true (default) uses a user-scoped Quadlet under cloudflared_podman_user;
# false uses system-wide rootful Quadlet
cloudflared_podman_rootless: true
cloudflared_podman_user: "{{ ansible_user | default(ansible_facts['user_id']) }}"
cloudflared_no_log: true
