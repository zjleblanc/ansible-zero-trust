---
- name: Resolve API credentials
  ansible.builtin.include_tasks: resolve_api_token.yml

- name: Assert required tunnel variables
  ansible.builtin.assert:
    fail_msg: >-
      Set cloudflare_account_id and cloudflare_tunnel_name (inventory or playbook vars).
    that:
      - cloudflare_account_id is defined
      - cloudflare_account_id | length > 0
      - cloudflare_tunnel_name is defined
      - cloudflare_tunnel_name | length > 0

- name: List existing Cloudflare tunnels by name
  no_log: "{{ cloudflare_no_log | default(true) }}"
  register: cloudflare_tunnel_list
  ansible.builtin.uri:
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    method: GET
    return_content: true
    status_code: [200]
    url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel?name={{ cloudflare_tunnel_name | urlencode }}&is_deleted=false"

- name: Set fact for existing tunnel match
  no_log: "{{ cloudflare_no_log | default(true) }}"
  ansible.builtin.set_fact:
    _cloudflare_existing_tunnel: >-
      {{ (cloudflare_tunnel_list.json.result | default([]))
         | selectattr('name', 'equalto', cloudflare_tunnel_name)
         | list
         | first
         | default({}, true) }}
    cacheable: false

- name: Set tunnel ID fact for destroy
  when: (_cloudflare_existing_tunnel.id | default('') | length) > 0
  no_log: "{{ cloudflare_no_log | default(true) }}"
  ansible.builtin.set_fact:
    cloudflare_tunnel_id: "{{ _cloudflare_existing_tunnel.id }}"
    cacheable: false

- name: Skip remote destroy when tunnel is not found
  when: (_cloudflare_existing_tunnel.id | default('') | length) == 0
  ansible.builtin.debug:
    msg: >-
      No active Cloudflare tunnel named '{{ cloudflare_tunnel_name }}' found;
      skipping Access, DNS, and tunnel deletion.

- name: List existing Access applications
  when:
    - (_cloudflare_existing_tunnel.id | default('') | length) > 0
    - (cloudflare_access_apps | default([]) | length) > 0
  no_log: "{{ cloudflare_no_log | default(true) }}"
  register: cloudflare_access_apps_list
  ansible.builtin.uri:
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    method: GET
    return_content: true
    status_code: [200]
    url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps"

- name: Delete Access application for each app
  when:
    - (_cloudflare_existing_tunnel.id | default('') | length) > 0
    - (cloudflare_access_apps | default([]) | length) > 0
  loop: "{{ cloudflare_access_apps | default([]) }}"
  loop_control:
    loop_var: cloudflare_access_app
    label: "{{ cloudflare_access_app.name }}"
  ansible.builtin.include_tasks: destroy_access_app.yml

- name: Assert zone is set when deleting DNS hostnames
  when:
    - (_cloudflare_existing_tunnel.id | default('') | length) > 0
    - (cloudflare_tunnel_hostnames | default([]) | length) > 0
  ansible.builtin.assert:
    fail_msg: >-
      Set cloudflare_zone when cloudflare_tunnel_hostnames is non-empty so DNS
      CNAME records can be removed.
    that:
      - cloudflare_zone is defined
      - cloudflare_zone | length > 0

- name: Delete proxied CNAME records for public hostnames
  when:
    - (_cloudflare_existing_tunnel.id | default('') | length) > 0
    - (cloudflare_tunnel_hostnames | default([]) | length) > 0
  loop: "{{ cloudflare_tunnel_hostnames }}"
  loop_control:
    label: "{{ item.hostname }}"
  no_log: "{{ cloudflare_no_log | default(true) }}"
  community.general.cloudflare_dns:
    state: absent
    api_token: "{{ cloudflare_api_token }}"
    record: >-
      {{ '@'
         if (item.hostname == cloudflare_zone)
         else (item.hostname | regex_replace('\\.' + (cloudflare_zone | regex_escape) + '$', '')) }}
    type: CNAME
    value: "{{ cloudflare_tunnel_id }}.cfargotunnel.com"
    zone: "{{ cloudflare_zone }}"

- name: Delete Cloudflare tunnel
  when: (_cloudflare_existing_tunnel.id | default('') | length) > 0
  no_log: "{{ cloudflare_no_log | default(true) }}"
  ansible.builtin.uri:
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    method: DELETE
    return_content: true
    status_code: [200]
    url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflare_tunnel_id }}"
