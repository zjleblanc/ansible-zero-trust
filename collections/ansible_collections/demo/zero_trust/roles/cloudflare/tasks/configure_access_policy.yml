---
- name: Assert Access app entry fields
  ansible.builtin.assert:
    fail_msg: >-
      Each cloudflare_access_apps entry requires name, hostname, and a non-empty
      policies list.
    that:
      - cloudflare_access_app.name is defined
      - cloudflare_access_app.name | length > 0
      - cloudflare_access_app.hostname is defined
      - cloudflare_access_app.hostname | length > 0
      - cloudflare_access_app.policies is defined
      - cloudflare_access_app.policies | length > 0

- name: Find existing Access application for hostname
  no_log: "{{ cloudflare_no_log | default(true) }}"
  ansible.builtin.set_fact:
    _cloudflare_access_app: >-
      {{ (cloudflare_access_apps_list.json.result | default([]))
         | selectattr('domain', 'defined')
         | selectattr('domain', 'equalto', cloudflare_access_app.hostname)
         | list
         | first
         | default({}, true) }}
    cacheable: false

- name: Create Access self-hosted application
  when: (_cloudflare_access_app.id | default('') | length) == 0
  no_log: "{{ cloudflare_no_log | default(true) }}"
  register: cloudflare_access_app_create
  ansible.builtin.uri:
    body:
      name: "{{ cloudflare_access_app.name }}"
      type: self_hosted
      domain: "{{ cloudflare_access_app.hostname }}"
      destinations:
        - type: public
          uri: "{{ cloudflare_access_app.hostname }}"
    body_format: json
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    method: POST
    return_content: true
    status_code: [200, 201]
    url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps"

- name: Set Access application ID
  no_log: "{{ cloudflare_no_log | default(true) }}"
  ansible.builtin.set_fact:
    _cloudflare_access_app_id: >-
      {{ cloudflare_access_app_create.json.result.id
         if (cloudflare_access_app_create is defined and not (cloudflare_access_app_create.skipped | default(false)))
         else _cloudflare_access_app.id }}
    cacheable: false

- name: Refresh Access applications list after create
  when: cloudflare_access_app_create is defined and not (cloudflare_access_app_create.skipped | default(false))
  no_log: "{{ cloudflare_no_log | default(true) }}"
  register: cloudflare_access_apps_list
  ansible.builtin.uri:
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    method: GET
    return_content: true
    status_code: [200]
    url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps"

- name: List policies for Access application
  no_log: "{{ cloudflare_no_log | default(true) }}"
  register: cloudflare_access_app_policies
  ansible.builtin.uri:
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: application/json
    method: GET
    return_content: true
    status_code: [200]
    url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps/{{ _cloudflare_access_app_id }}/policies"

- name: Apply each Access policy
  loop: "{{ cloudflare_access_app.policies }}"
  loop_control:
    loop_var: cloudflare_access_policy
    label: "{{ cloudflare_access_policy.name }}"
  ansible.builtin.include_tasks: configure_access_policy_entry.yml
