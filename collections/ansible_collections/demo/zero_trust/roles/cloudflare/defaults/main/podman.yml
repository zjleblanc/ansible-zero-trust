---
# install_podman / uninstall_podman
cloudflare_container_image: docker.io/cloudflare/cloudflared:latest
cloudflare_container_name: cloudflared
cloudflare_podman_secret_name: cloudflare_tunnel_token
cloudflare_uninstall_remove_image: true
# Podman network to join (e.g. shared with demo.zero_trust.vault); empty disables custom networking
cloudflare_podman_network: ""
# Rootless Podman toggle: true (default) uses a user-scoped Quadlet under cloudflare_podman_user;
# false uses system-wide rootful Quadlet
cloudflare_podman_rootless: true
cloudflare_podman_user: "{{ ansible_user | default(ansible_facts['user_id']) }}"
