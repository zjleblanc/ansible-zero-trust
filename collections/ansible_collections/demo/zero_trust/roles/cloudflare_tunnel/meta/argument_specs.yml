---
argument_specs:
  create:
    short_description: Create or find a Cloudflare Tunnel and retrieve the connector token
    set_facts:
      cloudflare_tunnel_id:
        type: str
        description: >-
          UUID of the created or existing tunnel. Consumed by
          demo.zero_trust.cloudflare_hostname.
      cloudflare_tunnel_token:
        type: str
        description: >-
          Connector auth token for the tunnel (sensitive; no_log, not cacheable).
          Consumed by demo.zero_trust.cloudflared.
    options:
      cloudflare_api_token:
        type: str
        required: false
        description: >-
          Cloudflare API token. Prefer CLOUDFLARE_API_TOKEN env var; falls back
          to this variable (e.g. from ansible-vault encrypted secrets).
      cloudflare_account_id:
        type: str
        required: true
        description: Cloudflare account ID
      cloudflare_api_base:
        type: str
        required: false
        default: https://api.cloudflare.com/client/v4
        description: Cloudflare API base URL
      cloudflare_tunnel_name:
        type: str
        required: true
        description: Human-readable tunnel name
      cloudflare_tunnel_config_src:
        type: str
        required: false
        default: cloudflare
        description: Tunnel config source (cloudflare for remotely managed)
      cloudflare_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output

  destroy:
    short_description: Delete the Cloudflare Tunnel via API (no-op when not found)
    options:
      cloudflare_api_token:
        type: str
        required: false
        description: >-
          Cloudflare API token. Prefer CLOUDFLARE_API_TOKEN env var; falls back
          to this variable (e.g. from ansible-vault encrypted secrets).
      cloudflare_account_id:
        type: str
        required: true
        description: Cloudflare account ID
      cloudflare_tunnel_name:
        type: str
        required: true
        description: Human-readable tunnel name to look up and delete
      cloudflare_api_base:
        type: str
        required: false
        default: https://api.cloudflare.com/client/v4
        description: Cloudflare API base URL
      cloudflare_no_log:
        type: bool
        required: false
        default: true
        description: Suppress sensitive task output
