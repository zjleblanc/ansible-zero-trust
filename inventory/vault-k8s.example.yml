---
# Example inventory for Vault via Helm on Kubernetes/OpenShift.
# Runs against the controller (local connection); kubeconfig must reach the cluster.
# ansible-playbook -i inventory/vault-k8s.example.yml playbooks/pb_setup_vault_k8s.yml
all:
  children:
    vault:
      hosts:
        localhost:
          ansible_connection: local

          vault_jwt_oidc_discovery_url: https://ansible.example.com/o

          # Cluster base domain (no https://, no apps. prefix). On OpenShift
          # this is discovered automatically from Ingress/cluster. From it the
          # role derives vault_k8s_route_host, vault_k8s_url, vault_fqdn, and
          # vault_addr (cluster.example.com → vault.apps.cluster.example.com).
          vault_k8s_cluster_base_url: cluster.example.com

          # Optional overrides:
          # vault_k8s_route_host: vault.apps.cluster.example.com
          # vault_fqdn: vault.apps.cluster.example.com
          # vault_k8s_url: https://vault.apps.cluster.example.com

          # Or disable the Route and supply an Ingress / external URL:
          # vault_k8s_route_enabled: false
          # vault_k8s_cluster_base_url: cluster.example.com
          # vault_k8s_url: https://vault.example.com

          # vault_k8s_cli: oc # OpenShift
          # vault_k8s_cli: kubectl # vanilla k8s
          # vault_k8s_kubeconfig: ~/.kube/config

          # Helm chart "dev" mode is already initialized/unsealed (default)
          # vault_k8s_dev_mode: true
          # vault_k8s_dev_root_token: root

          # Local path on the controller for synthetic/operator init_data.json
          # vault_storage_path: /opt/vault/data
