---
# Example inventory for Vault via Helm on Kubernetes/OpenShift.
# Runs against the controller (local connection); kubeconfig must reach the cluster.
# ansible-playbook -i inventory/vault-k8s.example.yml playbooks/pb_setup_vault.yml
all:
  children:
    ungrouped:
      hosts:
        localhost:
          ansible_connection: local

          vault_install_type: k8s
          # Used for vault_addr / JWT bound audiences (defaults include :vault_port)
          vault_fqdn: vault.apps.example.com
          vault_jwt_oidc_discovery_url: https://ansible.example.com/o

          # OpenShift Route (default). Set vault_k8s_route_enabled: false and
          # vault_k8s_url when using Ingress or another external URL instead.
          vault_k8s_route_enabled: true
          vault_k8s_route_host: vault.apps.example.com
          # vault_k8s_url: https://vault.apps.example.com

          # vault_k8s_cli: oc # OpenShift, 
          # vault_k8s_cli: kubectl # vanilla k8s
          # vault_k8s_kubeconfig: ~/.kube/config

          # Helm chart "dev" mode is already initialized/unsealed (default)
          # vault_k8s_dev_mode: true
          # vault_k8s_dev_root_token: root

          # Local path on the controller for synthetic/operator init_data.json
          # vault_storage_path: /opt/vault/data
