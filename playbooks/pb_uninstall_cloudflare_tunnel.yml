---
- name: Cloudflare Tunnel Uninstall
  hosts: "{{ _hosts | default(omit) }}"

  vars:
    teardown_tasks:
      - role: demo.zero_trust.cloudflared
        tasks_from: uninstall
      - role: demo.zero_trust.cloudflare_access_policy
        tasks_from: destroy
      - role: demo.zero_trust.cloudflare_hostname
        tasks_from: destroy
      - role: demo.zero_trust.cloudflare_tunnel
        tasks_from: destroy

  tasks:
    - name: Load ansible-vault secrets when CLOUDFLARE_API_TOKEN is unset
      when: lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | length == 0
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/secrets.yml"

    - name: "Run {{ _teardown_task.role | split('.') | last }}/{{ _teardown_task.tasks_from }}"
      loop: "{{ teardown_tasks }}"
      loop_control:
        loop_var: _teardown_task
        label: "{{ _teardown_task.role | split('.') | last }}/{{ _teardown_task.tasks_from }}"
      ansible.builtin.include_role:
        name: "{{ _teardown_task.role }}"
        tasks_from: "{{ _teardown_task.tasks_from }}"
