---
- name: Cloudflare Tunnel Uninstall
  hosts: "{{ _hosts | default(omit) }}"

  vars:
    _uninstall_scope: "{{ cloudflare_uninstall_scope | default('all') }}"
    _uninstall_scope_map:
      all:
        - uninstall_podman
        - destroy_tunnel
      local:
        - uninstall_podman
      remote:
        - destroy_tunnel
    cloudflare_uninstall_tasks: "{{ _uninstall_scope_map[_uninstall_scope] }}"

  tasks:
    - name: Load ansible-vault secrets when CLOUDFLARE_API_TOKEN is unset
      when:
        - _uninstall_scope != 'local'
        - lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | length == 0
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/secrets.yml"

    - name: "Run demo.zero_trust.cloudflare"
      loop: "{{ cloudflare_uninstall_tasks }}"
      loop_control:
        loop_var: function
        label: "{{ function }}"
      ansible.builtin.include_role:
        name: demo.zero_trust.cloudflare
        tasks_from: "{{ function }}"
