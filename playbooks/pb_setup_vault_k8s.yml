---
# Setup Vault via Helm on Kubernetes/OpenShift (controller runs with local connection).
# ansible-playbook -i inventory/vault-k8s.example.yml playbooks/pb_setup_vault_k8s.yml
- name: Setup Vault (Kubernetes/OpenShift)
  hosts: "{{ _hosts | default('vault') }}"

  vars:
    _vault_pre_init_tasks:
      - install_k8s
    _vault_init_tasks: "{{ vault_k8s_dev_mode | default(true) | ternary([], ['init_vault']) }}"
    _vault_post_init_tasks:
      - configure_jwt_auth
      - configure_kv_engine
      - configure_userpass_auth
    vault_tasks:
      - _vault_pre_init_tasks
      - _vault_init_tasks
      - _vault_post_init_tasks

  tasks:
    - name: Run demo.zero_trust.vault
      loop: "{{ vault_tasks | flatten }}"
      loop_control:
        loop_var: function
        label: "{{ function }}"
      ansible.builtin.include_role:
        name: demo.zero_trust.vault
        tasks_from: "{{ function }}"
